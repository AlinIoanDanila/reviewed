[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewed"
version = "0.1.0"
description = "Local-first AI code reviewer for Git diffs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["openai", "python-dotenv"]

[project.scripts]
reviewed = "reviewed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
